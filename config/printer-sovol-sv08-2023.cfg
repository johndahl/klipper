# Klipper configuration for the Sovol SV08 (2023) with the original
# ("stock") toolhead and the Sovol eddy current probe (LDC1612 based)
# mounted on that toolhead.
#
# The printer has two STM32F103 MCUs:
#   [mcu]        mainboard - X, Y, four Z, heat bed, filament sensor, fans
#   [extra_mcu]  toolhead  - extruder, hotend heater, hotend fan, eddy probe
# Both are wired to the host over their own USB link and both need Klipper
# firmware.  See SV08-MIGRATION.md for the flashing procedure.
#
# Read before using this file:
#   * The pin map below is transcribed from community SV08 configurations
#     (github.com/Rappetor/Sovol-SV08-Mainline, github.com/asnajder/
#     sv08-config), which were themselves derived from the stock Sovol
#     firmware.  It is NOT taken from a board schematic.  Compare every pin
#     with the stock printer.cfg of your own board revision, and confirm the
#     heater pins before applying power to the bed or hotend.
#   * Replace both "serial:" lines with the values reported by
#     "ls /dev/serial/by-id/".  If the two are swapped the hotend heater is
#     driven from the wrong MCU at full power.
#   * Every calibration value here (currents, PID, offsets, drive current)
#     is a starting point taken from someone else's machine and must be
#     re-derived on yours.
#   * The eddy probe must be calibrated before it may be used for Z.  Follow
#     docs/Eddy_Probe.md, "Performing initial calibration when homing with
#     probe".  The [force_move] section at the bottom is only needed for
#     that first run and should be removed afterwards.

[mcu]
serial: /dev/serial/by-id/**MAINBOARD_SERIAL_HERE**
restart_method: command

[mcu extra_mcu]
serial: /dev/serial/by-id/**TOOLHEAD_SERIAL_HERE**
restart_method: command

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
# The stock firmware runs 700 mm/s and 40000 mm/s^2, but only with input
# shaping enabled.  Raise these after [input_shaper] has been tuned.
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0

#--------------------------------------------------------------------
# X / Y - sensorless homing on the TMC2209 DIAG pins
#--------------------------------------------------------------------

[stepper_x]
step_pin: PE2
dir_pin: !PE0
enable_pin: !PE3
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PE1
uart_address: 3
diag_pin: PE15
run_current: 1.1
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 0
# Sensorless homing sensitivity - re-tune, see TMC_Tune.md
driver_SGTHRS: 70

[stepper_y]
step_pin: PB8
dir_pin: !PB6
enable_pin: !PB9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 364
position_max: 364
homing_speed: 30
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_y]
# Note: PB6/PB7 on the mainboard are the Y stepper.  The eddy probe uses
# PB6/PB7 on the *toolhead* MCU - they are different chips and do not
# conflict.
uart_pin: PB7
uart_address: 3
diag_pin: PE13
run_current: 1.1
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 0
driver_SGTHRS: 70

#--------------------------------------------------------------------
# Z - four steppers, quad gantry, Z endstop is the eddy probe
#--------------------------------------------------------------------

[stepper_z]
step_pin: PC0
dir_pin: PE5
enable_pin: !PC1
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 347
# Travel below the bed is required for "tap" probing; -5 is the stock value
position_min: -5
homing_speed: 15.0
second_homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 15.0

[tmc2209 stepper_z]
uart_pin: PE6
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

# Verify every Z dir_pin against the stock config: an inverted Z here
# tilts the gantry instead of lifting it.
[stepper_z1]
step_pin: PD3
dir_pin: !PD1
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD2
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[stepper_z2]
step_pin: PD7
dir_pin: PD5
enable_pin: !PB5
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD6
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

[stepper_z3]
step_pin: PD11
dir_pin: !PD9
enable_pin: !PD12
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD10
uart_address: 3
run_current: 0.55
sense_resistor: 0.150
interpolate: True
stealthchop_threshold: 999999

#--------------------------------------------------------------------
# Toolhead (extra_mcu)
#--------------------------------------------------------------------

# Sovol hotend thermistor (110k, 11.5k pullup) - table from the stock config
[thermistor sovol_hotend]
temperature1: 25
resistance1: 110000
temperature2: 100
resistance2: 7008
temperature3: 220
resistance3: 435

[extruder]
step_pin: extra_mcu:PA8
dir_pin: extra_mcu:PB8
enable_pin: !extra_mcu:PB11
rotation_distance: 6.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: extra_mcu:PB9
sensor_type: sovol_hotend
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5
min_temp: 5
max_temp: 305
max_power: 1.0
# The stock firmware allows cold extrusion (min_extrude_temp: 5); 170 is
# the usual Klipper default.  Lower it only if you know why.
min_extrude_temp: 170
control: pid
pid_kp: 33.838
pid_ki: 5.223
pid_kd: 47.752
pressure_advance: 0.025
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: extra_mcu:PB10
uart_address: 3
run_current: 0.8
sense_resistor: 0.150
interpolate: True

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2

#--------------------------------------------------------------------
# Bed, filament sensor
#--------------------------------------------------------------------

# Sovol bed thermistor (100k) - table from the stock config
[thermistor sovol_bed]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PA0
sensor_type: sovol_bed
sensor_pin: PC5
max_power: 1.0
min_temp: 5
max_temp: 105
control: pid
pid_kp: 73.571
pid_ki: 1.820
pid_kd: 783.849

[verify_heater heater_bed]
max_error: 120
check_gain_time: 40
hysteresis: 5
heating_gain: 2

[filament_switch_sensor filament_sensor]
switch_pin: PE9
pause_on_runout: True

#--------------------------------------------------------------------
# Sovol eddy current probe (LDC1612) on the original toolhead
#--------------------------------------------------------------------

[probe_eddy_current my_eddy_probe]
sensor_type: ldc1612
i2c_mcu: extra_mcu
# Software I2C on purpose: the toolhead wiring does not expose a usable
# hardware I2C1 and the STM32F103 I2C peripheral has errata that Klipper
# does not work around.  Software I2C runs here at the driver default of
# 400 kHz (Klipper's hardware I2C on F103 is limited to 100 kHz).
i2c_software_scl_pin: extra_mcu:PB6
i2c_software_sda_pin: extra_mcu:PB7
# Probe offsets relative to the nozzle - verify with Probe_Calibrate.md
x_offset: -16.43
y_offset: 10.22
descend_z: 0.5
# Starting point only.  Recalibrate for your machine and bed temperature
# with LDC_CALIBRATE_DRIVE_CURRENT, then SAVE_CONFIG.
reg_drive_current: 22
# The stock sensor counts above the driver's 5 MHz default ceiling, which
# makes the driver divide the count down and warns after calibration.
# Confirm this against the "Total frequency range" line printed by
# PROBE_EDDY_CURRENT_CALIBRATE before trusting it.
max_sensor_hz: 8426835
# "tap" probing is optional.  Calibrate it with
# PROBE_EDDY_CURRENT_TAP_CALIBRATE before uncommenting:
#tap_threshold: 7545
#tap_z_offset: 0.0

[bed_mesh]
speed: 250
horizontal_move_z: 1.5
# Bounds for this eddy mount; re-check after the offsets are verified
mesh_min: 13, 15
mesh_max: 333, 340
probe_count: 15, 15
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125
mesh_pps: 3, 3
adaptive_margin: 5
fade_start: 1
fade_end: 10
fade_target: 0
scan_overshoot: 4
zero_reference_position: 177.50, 182.00

[quad_gantry_level]
gantry_corners:
    -60, -10
    410, 420
points:
    36, 10
    36, 320
    346, 320
    346, 10
speed: 400
# 5 mm, not the 10 mm used with the stock switch probe: the eddy sensor
# only reads reliably close to the bed
horizontal_move_z: 5
retry_tolerance: 0.05
retries: 5
max_adjust: 10

[homing_override]
axes: xyz
gcode:
  # Z has no switch endstop - it is homed with the eddy probe, so the
  # sensor has to be over the bed before G28 Z.  Home X and Y (sensorless)
  # first, then move the nozzle so the sensor sits on the bed centre.
  {% set wanted = rawparams.upper() if rawparams else '' %}
  {% if not wanted or 'X' in wanted %}
    G28 X
  {% endif %}
  {% if not wanted or 'Y' in wanted %}
    G28 Y
  {% endif %}
  {% if not wanted or 'Z' in wanted %}
    {% if 'X' not in printer.toolhead.homed_axes %}
      G28 X
    {% endif %}
    {% if 'Y' not in printer.toolhead.homed_axes %}
      G28 Y
    {% endif %}
    {% set eddy = printer.configfile.settings['probe_eddy_current my_eddy_probe'] %}
    G0 X{177.50 - eddy.x_offset} Y{182.00 - eddy.y_offset} F6000
    M400
    G28 Z
  {% endif %}
  G90

#--------------------------------------------------------------------
# Fans, LEDs, temperatures
#--------------------------------------------------------------------

[multi_pin print_cooling_fan_pins]
pins: extra_mcu:PA7, extra_mcu:PB1

[fan]
pin: multi_pin:print_cooling_fan_pins
max_power: 1.0

[heater_fan hotend_fan]
pin: extra_mcu:PA6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_pin: extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

[controller_fan MCU_fan]
pin: PA1
max_power: 1.0
kick_start_time: 0.5
fan_speed: 1.0
idle_timeout: 300
heater: extruder, heater_bed
stepper: stepper_x, stepper_y

[fan_generic exhaust_fan]
pin: PA2
max_power: 1.0

[led main_led]
white_pin: PA3
cycle_time: 0.010
initial_WHITE: 1.0

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor toolhead_temp]
sensor_type: temperature_mcu
sensor_mcu: extra_mcu
min_temp: 0
max_temp: 100

[temperature_sensor host_temp]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

#--------------------------------------------------------------------
# Misc
#--------------------------------------------------------------------

[pause_resume]

[exclude_object]

# Needed only for the very first eddy calibration (see docs/Eddy_Probe.md,
# "Performing initial calibration when homing with probe").  Remove it
# once PROBE_EDDY_CURRENT_CALIBRATE has been run successfully.
[force_move]
enable_force_move: True

# The stock toolhead carries an ADXL345 on the toolhead MCU.  It works
# with mainline Klipper, but confirm the CS pin on your board first.
#[adxl345]
#cs_pin: extra_mcu:PB12
#spi_software_sclk_pin: extra_mcu:PB3
#spi_software_mosi_pin: extra_mcu:PB5
#spi_software_miso_pin: extra_mcu:PB4

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    177.5, 177.5, 30
